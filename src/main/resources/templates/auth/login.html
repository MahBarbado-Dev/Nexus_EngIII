<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso de demonstração | BookNexus</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <style>
        /* ===== PALETA DE CORES (do root) ===== */
        :root {
            --forest-950: #0b251d;
            --forest-900: #123d2d;
            --forest-800: #17513b;
            --forest-700: #1c694b;
            --green-600: #2f8a5f;
            --green-500: #43a971;
            --green-400: #73c98e;
            --mint-100: #eaf8ed;
            --mint-50: #f6fcf7;
            --gold-500: #d7a743;
            --ink-900: #173128;
            --ink-700: #496057;
            --ink-500: #70847b;
            --line: #dce9df;
            --surface: #ffffff;
            --danger: #c95d57;
            --shadow: 0 18px 45px rgba(21, 69, 48, .12);
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0a261c 0%, #15583d 52%, #32845a 100%);
        }

        /* ===== CARD PRINCIPAL ===== */
        .login-container {
            width: 100%;
            max-width: 480px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 28px;
            padding: 48px 42px 40px 42px;
            box-shadow: 0 30px 75px rgba(0, 0, 0, 0.28);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== MARCA ===== */
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            margin-bottom: 8px;
        }

        .brand-mark {
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            border-radius: 12px;
            background: var(--green-500);
            color: white;
            font-size: 1.4rem;
        }

        .brand-name {
            font-size: 30px;
            font-weight: 800;
            color: var(--forest-900);
            letter-spacing: -0.5px;
        }

        .brand-sub {
            display: block;
            color: var(--ink-500);
            font-size: 13px;
            font-weight: 500;
            margin-top: -2px;
            letter-spacing: 0.8px;
        }

        /* ===== TEXTO DE APRESENTAÇÃO ===== */
        .login-copy {
            margin: 20px 0 28px 0;
        }

        .login-copy .eyebrow {
            font-size: 12px;
            font-weight: 700;
            color: var(--green-600);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .login-copy .eyebrow i {
            font-size: 14px;
        }

        .login-copy h1 {
            font-size: 24px;
            margin: 12px 0 8px 0;
            color: var(--ink-900);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-copy p {
            color: var(--ink-500);
            font-size: 14px;
            line-height: 1.6;
        }

        .login-copy .highlight {
            color: var(--green-600);
            font-weight: 600;
        }

        /* ===== CAMPOS DE LOGIN ===== */
        .demo-fields {
            background: var(--mint-50);
            border-radius: 18px;
            padding: 6px 6px 6px 6px;
            margin: 0 0 20px 0;
            border: 1px solid var(--line);
            overflow: hidden;
        }

        .demo-fields .field-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            background: white;
            border-radius: 14px;
            margin: 4px 4px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .demo-fields .field-row:focus-within {
            border-color: var(--green-400);
            box-shadow: 0 0 0 3px rgba(67, 169, 113, 0.12);
        }

        .demo-fields .field-row:first-child {
            margin-bottom: 4px;
        }

        .demo-fields .field-row .field-icon {
            font-size: 18px;
            color: var(--green-600);
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .demo-fields .field-row .field-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            color: var(--ink-900);
            font-weight: 500;
            padding: 4px 0;
            outline: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .demo-fields .field-row .field-input::placeholder {
            color: var(--ink-500);
            font-weight: 400;
        }

        .demo-fields .field-row .field-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 14px;
            border-radius: 20px;
            background: var(--mint-100);
            color: var(--green-600);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .demo-fields .field-row .field-badge.client {
            background: #e0f5e7;
            color: var(--green-600);
        }

        .demo-fields .field-row .field-badge.admin {
            background: #eaf5ed;
            color: var(--forest-700);
        }

        .demo-fields .field-row .field-password-dots {
            font-size: 18px;
            letter-spacing: 4px;
            color: var(--green-600);
            font-weight: 700;
            flex: 1;
            text-align: left;
        }

        .demo-note {
            font-size: 12px;
            color: var(--ink-500);
            padding: 0 16px 14px 16px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .demo-note i {
            color: var(--green-600);
            font-size: 14px;
        }

        /* ===== BOTÕES DE ACESSO ===== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 6px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .btn i {
            font-size: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--forest-800), var(--green-500));
            color: white;
            box-shadow: 0 8px 25px rgba(32, 116, 76, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(32, 116, 76, 0.35);
        }

        .btn-secondary {
            background: var(--mint-100);
            color: var(--forest-800);
            border-color: var(--line);
        }

        .btn-secondary:hover {
            background: #d5efe0;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(32, 116, 76, 0.08);
        }

        .btn .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: inherit;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-secondary .badge {
            background: rgba(67, 169, 113, 0.15);
            color: var(--forest-700);
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 26px 0 18px 0;
            color: var(--ink-500);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--line);
        }

        .divider span {
            padding: 0 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--ink-500);
        }

        /* ===== LINKS ADICIONAIS ===== */
        .links {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .links a {
            color: var(--green-600);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .links a:hover {
            color: var(--forest-800);
            text-decoration: underline;
        }

        /* ===== RODAPÉ DO PROTÓTIPO ===== */
        .prototype-note {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
            color: var(--ink-500);
            font-size: 12px;
            line-height: 1.6;
        }

        .prototype-note strong {
            color: var(--green-600);
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 20px 28px 20px;
            }

            .brand-name {
                font-size: 24px;
            }

            .login-copy h1 {
                font-size: 20px;
            }

            .demo-fields .field-row {
                padding: 12px 14px;
                flex-wrap: wrap;
                gap: 6px;
            }

            .demo-fields .field-row .field-input {
                flex: 1 1 100%;
                font-size: 14px;
            }

            .demo-fields .field-row .field-password-dots {
                flex: 1 1 100%;
                font-size: 16px;
            }

            .btn {
                font-size: 14px;
                padding: 14px 16px;
            }

            .links {
                gap: 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">

        <!-- ===== MARCA ===== -->
        <a class="brand" href="/login.html">
            <span class="brand-mark"><i class="bi bi-book-half"></i></span>
            <div>
                <span class="brand-name">BookNexus</span>
                <span class="brand-sub">conhecimento conectado</span>
            </div>
        </a>

        <!-- ===== TEXTO DE APRESENTAÇÃO ===== -->
        <div class="login-copy">
            <p class="eyebrow"><i class="bi bi-stars"></i>Livraria Online</p>
            <h1>Seu próximo capítulo começa aqui.</h1>
            <p>
            </p>
        </div>

        <!-- ===== CAMPOS DE LOGIN ===== -->
        <div class="demo-fields">
            <div class="field-row">
                <span class="field-icon"><i class="bi bi-envelope"></i></span>
                <input type="email" class="field-input" value="cliente@email.com" readonly />
            </div>
            <div class="field-row">
                <span class="field-icon"><i class="bi bi-lock"></i></span>
                <span class="field-password-dots">••••••</span>
            </div>
            </div>

        <!-- ===== BOTÕES DE ACESSO ===== -->
        <div class="btn-group">
            <a href="/home.html" class="btn btn-primary">
                <i class="bi bi-person-heart"></i>
                Entrar como Cliente
            </a>

            <a href="/admin-home.html" class="btn btn-secondary">
                <i class="bi bi-grid-1x2-fill"></i>
                Entrar como Admin
            </a>
        </div>

        <!-- ===== DIVIDER ===== -->
        <div class="divider">
            <span>Navegação rápida</span>
        </div>

        <!-- ===== LINKS ADICIONAIS ===== -->
        <div class="links">
            <a href="#">
                <i class="bi bi-person-plus"></i> Criar conta
            </a>
            <a href="#">
                <i class="bi bi-house"></i> Loja
            </a>
            <a href="#">
                <i class="bi bi-question-circle"></i> Ajuda
            </a>
        </div>
    </div>
</div>

</body>
</html>
